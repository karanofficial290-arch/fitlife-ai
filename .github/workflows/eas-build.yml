name: Android build (EAS)

# Started by hand from the GitHub Actions tab ("Run workflow").
# Needs a repository secret named EXPO_TOKEN (an expo.dev access token).

on:
  # Also starts automatically when a pushed commit message contains [eas-build]
  # (so no button is needed on a phone).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = installable APK, production = Play Store bundle'
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[eas-build]')
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    timeout-minutes: 90
    steps:
      - name: Check EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Add a repository secret named EXPO_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build on EAS and wait for the result
        run: |
          set +e
          eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json 2> build.err
          CODE=$?
          set -e
          cat build.json; cat build.err >&2

          # Annotations are readable without logging in, so surface the outcome there.
          ID=$(jq -r '.[0].id // empty' build.json 2>/dev/null || true)
          STATUS=$(jq -r '.[0].status // "unknown"' build.json 2>/dev/null || echo unknown)
          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build.json 2>/dev/null || true)
          if [ -n "$ID" ]; then
            echo "::notice title=EAS build ${STATUS}::https://expo.dev/accounts/fitmxos-team/projects/fitmxo/builds/${ID}"
            ERR=$(jq -r '.[0].error | if . then "\(.errorCode): \(.message)" else empty end' build.json 2>/dev/null || true)
            [ -n "$ERR" ] && echo "::error title=EAS build error::$(echo "$ERR" | head -c 900 | tr '\n' ' ')"
          fi
          if [ -n "$URL" ]; then
            echo "::notice title=Download ($PROFILE)::${URL}"
          fi
          if [ "$CODE" -ne 0 ]; then
            # Last lines of the CLI output usually name the failing phase.
            echo "::error title=eas build exited ${CODE}::$(grep -v '^\s*$' build.err | tail -n 25 | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ' | head -c 1500)"
            exit "$CODE"
          fi
